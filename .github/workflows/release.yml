# Releases dev to Google Play internal testing (and open testing once PLAY_OPEN_TESTING is
# true), at noon and 6 p.m. Central or when dispatched from dev with a bump (docs/releasing.md).
#
# - plan and build run repo code with read-only contents and no secrets, environment or OIDC
#   token. build makes the unsigned bundle and reports its SHA256SUMS digest.
# - publish holds the release secrets. It checks out only .github/release/, verifies the bundle
#   against build's digest and treats it as data: it signs and uploads it, never runs it. AWS
#   credentials are step outputs passed to the one step that reads a secret
#   (.github/release/with-secrets.sh); nothing goes to $GITHUB_ENV.
# - The tag and GitHub release are made last, after Play took the build.
#
# This file and .github/release/ are the security boundary for releases. The release
# environment only allows dev, and the AWS role trusts only this file at refs/heads/dev.
name: Release

on:
  schedule:
    # GitHub cron is UTC. These cover noon and 6 p.m. in both CST and CDT; plan.sh drops the
    # two that don't match.
    - cron: "0 0,17,18,23 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest tag
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      code: ${{ steps.plan.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: plan
        run: bash .github/release/plan.sh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    env:
      OC_VERSION_NAME: ${{ needs.plan.outputs.version }}
      OC_VERSION_CODE: ${{ needs.plan.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install the SDK platform and build tools
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      - name: Prefer Google's Maven Central mirror
        run: install -Dm644 .github/gradle/maven-mirror.init.gradle.kts "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/maven-mirror.init.gradle.kts"

      - name: Build the unsigned release bundle
        run: |
          ./gradlew :app:bundleRelease
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/opencode-android.aab"
          # R8 renames classes in release; Play needs the mapping to show readable crash traces.
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/out/mapping.txt"

      - id: upload
        uses: ./.github/release/upload
        with:
          name: bundle
          path: ${{ runner.temp }}/out
          retention-days: 30

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      OC_VERSION: ${{ needs.plan.outputs.version }}
      OC_VERSION_CODE: ${{ needs.plan.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: ./.github/release/download
        with:
          pattern: bundle
          digests: bundle=${{ needs.build.outputs.digest }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - id: aws
        name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-android-release
          role-session-name: opencode-android-${{ github.run_id }}
          role-duration-seconds: 900
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Sign the bundle with the upload key
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          OC_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          bash .github/release/with-secrets.sh \
            ANDROID_UPLOAD_KEYSTORE_BASE64=opencode-android/release/ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD=opencode-android/release/ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            -- bash .github/release/sign-bundle.sh \
            "$RUNNER_TEMP/in/bundle/opencode-android.aab" "$RUNNER_TEMP/opencode-android-$OC_VERSION.aab"

      - name: Upload to Google Play
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          PLAY_OPEN_TESTING: ${{ vars.PLAY_OPEN_TESTING }}
        run: |
          bash .github/release/with-secrets.sh \
            PLAY_SERVICE_ACCOUNT_JSON=opencode-android/release/PLAY_SERVICE_ACCOUNT_JSON \
            -- bash .github/release/ship-play.sh \
            "$RUNNER_TEMP/opencode-android-$OC_VERSION.aab" "$RUNNER_TEMP/in/bundle/mapping.txt"

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OC_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: bash .github/release/publish-github-release.sh
