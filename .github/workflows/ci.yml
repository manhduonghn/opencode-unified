# Checks every pull request and push with scripts/check.sh (translations, assemble, lint, unit
# tests). Nothing here holds a secret or an OIDC token. Branch and dispatch builds publish the
# debug APK straight to the rolling `dev-latest` pre-release for sideloading. Releases are release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Only the pre-release step needs write; pull requests skip it.
      contents: write
    env:
      OC_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp the build
        run: echo "OC_VERSION_SUFFIX=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install the SDK platform, build tools and NDK
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" > /dev/null

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only the long-lived branches write the cache, so pull requests can't evict or poison it.
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

      - name: Prefer Google's Maven Central mirror
        run: install -Dm644 .github/gradle/maven-mirror.init.gradle.kts "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/maven-mirror.init.gradle.kts"

      - name: Check (translations, assemble, lint, unit tests)
        run: scripts/check.sh

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "opencode-android-${OC_VERSION_SUFFIX}.apk"

      - name: Publish the dev-latest pre-release
        # A pull request never gets write permission to the base repository's releases.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp "opencode-android-${OC_VERSION_SUFFIX}.apk" opencode-android.apk
          title="dev-latest · ${OC_VERSION_SUFFIX}"
          notes="Debug build of ${GITHUB_SHA} (version 0.1.0-${OC_VERSION_SUFFIX}, code ${GITHUB_RUN_NUMBER}). Install steps: see the README's \"Try it on Android\"."
          if gh release view dev-latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/dev-latest" -f sha="${GITHUB_SHA}" -F force=true > /dev/null
            gh release edit dev-latest --title "$title" --notes "$notes" --prerelease --latest=false
            gh release upload dev-latest opencode-android.apk --clobber
          else
            gh release create dev-latest opencode-android.apk --prerelease --latest=false --target "${GITHUB_SHA}" --title "$title" --notes "$notes"
          fi
