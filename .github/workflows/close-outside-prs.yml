# Closes pull requests from outside contributors with a pointer to issues (see the README).
# pull_request_target runs this file from dev with the base repo's token, so it must never check
# out or run code from the pull request.
name: Close outside PRs

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Close the PR unless the author has write access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
        run: |
          # Members with private org membership arrive as CONTRIBUTOR, so check their access too.
          permission=$(gh api "repos/$GH_REPO/collaborators/$AUTHOR/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write)
              echo "$AUTHOR has $permission access, leaving #$PR open"
              exit 0
              ;;
          esac

          marker='<!-- close-outside-prs -->'
          if ! gh api --paginate "repos/$GH_REPO/issues/$PR/comments" --jq '.[].body' | grep -qF "$marker"; then
            gh pr comment "$PR" --body "We don't accept pull requests from outside contributors. Open an [issue]($ISSUES_URL) instead: our agent triages every issue automatically and the team picks up the work.

          $marker"
          fi
          gh pr close "$PR"
